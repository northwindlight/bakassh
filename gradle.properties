# RPi5 构建环境的硬约束（都是实测踩出来的，别改）：
#  1) 内核 16KB 页，box64 把 x86_64 的 mmap 偏移按 4KB 对齐 -> 官方 aapt2 mmap 时 EINVAL
#     必须用 Debian 原生 aarch64 /usr/bin/aapt2
#  2) 那个 aapt2 是 AOSP 14，读不懂 API 35/36 的 resources.arsc -> compileSdk 固定 34
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.aapt2FromMavenOverride=/usr/bin/aapt2
